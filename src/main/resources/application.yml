spring:
  application:
    name: certis

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certis}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

digital-hustle:
  certis:
    security:
      jwt:
        secret: ${JWT_SECRET}
        access-duration: ${ACCESS_TOKEN_DURATION_HOURS}
        refresh-duration: ${REFRESH_TOKEN_DURATION_DAYS}