spring:
  application:
    name: certis

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certis}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: false

server:
  port: 8080

digital-hustle:
  certis:
    security:
      jwt:
        secret: ${JWT_SECRET:local-development-jwt-secret-with-at-least-32-bytes}
        access-duration: ${ACCESS_TOKEN_DURATION_HOURS:24}
        refresh-duration: ${REFRESH_TOKEN_DURATION_DAYS:7}
