[versions]
kotlin = "2.3.20"
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"

detekt = "1.23.8"
ktlint = "12.2.0"
liquibase = "4.33.0"

jooq-version = "3.19.27"
jooq-gradle = "10.2.1"
postgresql = "42.7.8"
picocli = "4.7.5"
snakeyaml = "2.4"

liquibase-gradle = "3.1.0"

ksp = "2.3.7"

[libraries]
spring-boot-bom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot" }

kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
jackson-module-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin" }

spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-boot-starter-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-jdbc" }
spring-boot-starter-jooq = { group = "org.springframework.boot", name = "spring-boot-starter-jooq" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }

postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
liquibase-core = { group = "org.liquibase", name = "liquibase-core", version.ref = "liquibase" }

jooq-jackson-extensions = { group = "org.jooq", name = "jooq-jackson-extensions", version.ref = "jooq-version" }
#jooq-meta-extensions-liquibase = { group = "org.jooq", name = "jooq-meta-extensions-liquibase", version.ref = "jooq-version" }

picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
liquibase = { id = "org.liquibase.gradle", version.ref = "liquibase-gradle" }
jooq-plugin = { id = "nu.studer.jooq", version.ref = "jooq-gradle" }

detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]
liquibase-runtime = ["liquibase-core", "picocli", "postgresql"]
