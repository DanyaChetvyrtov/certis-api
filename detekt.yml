config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  excludes:
    - '.*/generated/.*'
    - '.*/build/.*'
    - '.*\.kts'

complexity:
  active: true

  LongParameterList:
    active: true
    allowedFunctionParameters: 10
    allowedConstructorParameters: 10
    ignoreDefaultParameters: false
    ignoreDataClasses: true

  ComplexCondition:
    active: true
    allowedConditions: 7

  ComplexInterface:
    active: true
    allowedDefinitions: 10

  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 15

  NestedBlockDepth:
    active: true
    allowedDepth: 4

  MethodOverloading:
    active: true
    allowedOverloads: 5
    excludes:
      - '**/mapper/**'
      - '**/mappers/**'

  LargeClass:
    active: true
    allowedLines: 300
    excludes:
      - '**/src/test/**'

  LongMethod:
    active: true
    allowedLines: 60

  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20


naming:
  active: true

  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'

  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - 'Test'
      - 'ParameterizedTest'
      - 'RepeatedTest'
      - 'TestFactory'
      - 'TestTemplate'
      - 'BeforeEach'
      - 'AfterEach'
      - 'BeforeAll'
      - 'AfterAll'

  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'

  ConstructorParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'

  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'

  LambdaParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*|_'

  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'

  BooleanPropertyNaming:
    active: true

  NonBooleanPropertyPrefixedWithIs:
    active: false

  MemberNameEqualsClassName:
    active: true


style:
  active: true

  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreRanges: true

  ForbiddenComment:
    active: true
    comments:
      - reason: 'Use issue tracker instead'
        value: 'TODO'
      - reason: 'Fix before merge'
        value: 'FIXME'

  ReturnCount:
    active: true
    max: 3
    excludedFunctions:
      - 'equals'
      - 'hashCode'

  ThrowsCount:
    active: true
    max: 2

  DataClassContainsFunctions:
    active: false

  DataClassShouldBeImmutable:
    active: true

  UseIfEmptyOrIfBlank:
    active: true

  UseEmptyCounterpart:
    active: true

  ModifierOrder:
    active: true

  RedundantVisibilityModifier:
    active: true

  NestedClassesVisibility:
    active: true

  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'

  UnusedPrivateClass:
    active: true

  UnusedPrivateFunction:
    active: true

  UnusedPrivateProperty:
    active: true

  UnusedVariable:
    active: true

  VarCouldBeVal:
    active: true


exceptions:
  active: true

  TooGenericExceptionCaught:
    active: false

  TooGenericExceptionThrown:
    active: true

  InstanceOfCheckForException:
    active: true

  PrintStackTrace:
    active: true

  RethrowCaughtException:
    active: true

  ReturnFromFinally:
    active: true

  SwallowedException:
    active: true

  ThrowingExceptionFromFinally:
    active: true

  ThrowingExceptionsWithoutMessageOrCause:
    active: true

  ThrowingNewInstanceOfSameException:
    active: true


potential-bugs:
  active: true

  EqualsAlwaysReturnsTrueOrFalse:
    active: true

  EqualsWithHashCodeExist:
    active: true

  ExplicitGarbageCollectionCall:
    active: true

  HasPlatformType:
    active: true

  InvalidRange:
    active: true

  IteratorHasNextCallsNextMethod:
    active: true

  IteratorNotThrowingNoSuchElementException:
    active: true

  LateinitUsage:
    active: false

  MapGetWithNotNullAssertionOperator:
    active: true

  UnreachableCode:
    active: true

  UnsafeCast:
    active: true

  UnnecessaryNotNullOperator:
    active: true

  UnnecessarySafeCall:
    active: true


performance:
  active: true

  ArrayPrimitive:
    active: true

  CouldBeSequence:
    active: false

  ForEachOnRange:
    active: true

  SpreadOperator:
    active: true

  UnnecessaryTemporaryInstantiation:
    active: true

comments:
  active: true

  UndocumentedPublicClass:
    active: false

  UndocumentedPublicFunction:
    active: false

  UndocumentedPublicProperty:
    active: false