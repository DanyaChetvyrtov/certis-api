name: CI Pipeline for Spring Boot with Kotlin

on:
  pull_request:
    branches: [ dev, master ]
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: certis_test
  DB_USER: certis_user
  DB_PASSWORD: certis_pass
  DB_SCHEMA: keeper

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Apply Liquibase migrations
        run: ./gradlew update

      - name: Build and run checks (tests, detekt, ktlint, jacoco)
        run: ./gradlew check --continue -Dspring.profiles.active=test

      - name: Publish JUnit Test Report
        if: ${{ always() && hashFiles('build/test-results/test/TEST-*.xml') != '' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          check_name: JUnit Test Report
          detailed_summary: true
          include_time_in_summary: true
          require_tests: true
          fail_on_parse_error: true
          fail_on_failure: false

      - name: Publish Detekt Summary
        if: ${{ always() && hashFiles('build/reports/detekt/detekt.md') != '' }}
        run: |
          cat build/reports/detekt/detekt.md >> "$GITHUB_STEP_SUMMARY"

      - name: Merge ktlint SARIF reports
        if: ${{ always() && hashFiles('build/reports/ktlint/**/*.sarif') != '' }}
        run: |
          jq -s '
            {
              version: "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              runs: [.[].runs[]]
            }
          ' \
            build/reports/ktlint/ktlintMainSourceSetCheck/ktlintMainSourceSetCheck.sarif \
            build/reports/ktlint/ktlintTestSourceSetCheck/ktlintTestSourceSetCheck.sarif \
            build/reports/ktlint/ktlintKotlinScriptCheck/ktlintKotlinScriptCheck.sarif \
            > build/reports/ktlint/ktlint-combined.sarif

      - name: Set up reviewdog
        if: ${{ always() }}
        uses: reviewdog/action-setup@v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Publish Detekt Check
        if: ${{ always() && hashFiles('build/reports/detekt/detekt.sarif') != '' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          reviewdog \
            -f=sarif \
            -name=detekt \
            -reporter=github-check \
            -filter-mode=nofilter \
            -level=error \
            -fail-level=none \
            < build/reports/detekt/detekt.sarif

      - name: Publish ktlint Check
        if: ${{ always() && hashFiles('build/reports/ktlint/ktlint-combined.sarif') != '' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          reviewdog \
            -f=sarif \
            -name=ktlint \
            -reporter=github-check \
            -filter-mode=nofilter \
            -level=error \
            -fail-level=none \
            < build/reports/ktlint/ktlint-combined.sarif

  docker-build-validation:
    name: Validate Docker image
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Detect Docker build input changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'gradle/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'

      - name: Check out repository
        if: ${{ steps.changes.outputs.docker == 'true' }}
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: ${{ steps.changes.outputs.docker == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: ${{ steps.changes.outputs.docker == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
